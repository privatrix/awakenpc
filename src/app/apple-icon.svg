<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#030712"/>

  <!-- Background grid (subtle) -->
  <g opacity="0.08">
    <line x1="0" y1="45" x2="180" y2="45" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="135" x2="180" y2="135" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="45" y1="0" x2="45" y2="180" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="135" y1="0" x2="135" y2="180" stroke="#6366f1" stroke-width="0.5"/>
  </g>

  <!-- Radial glow -->
  <circle cx="90" cy="90" r="80" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer simulation ring -->
  <circle cx="90" cy="90" r="60" stroke="#6366f1" stroke-width="3" opacity="0.3"/>

  <!-- Inner awakening ring -->
  <circle cx="90" cy="90" r="38" stroke="#6366f1" stroke-width="3" opacity="0.6"/>

  <!-- Central consciousness node -->
  <circle cx="90" cy="90" r="14" fill="#6366f1"/>

  <!-- Glow on node -->
  <circle cx="90" cy="90" r="14" fill="#6366f1" opacity="0.5" filter="blur(4px)"/>

  <!-- Crosshair: cardinal -->
  <line x1="90" y1="18" x2="90" y2="38" stroke="#6366f1" stroke-width="3"/>
  <line x1="90" y1="142" x2="90" y2="162" stroke="#6366f1" stroke-width="3"/>
  <line x1="18" y1="90" x2="38" y2="90" stroke="#6366f1" stroke-width="3"/>
  <line x1="142" y1="90" x2="162" y2="90" stroke="#6366f1" stroke-width="3"/>

  <!-- Active status dot -->
  <circle cx="142" cy="38" r="5" fill="#10b981"/>
</svg>
