<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background: deep simulation black -->
  <rect width="64" height="64" rx="12" fill="#030712"/>

  <!-- Outer ring: the simulation boundary -->
  <circle cx="32" cy="32" r="22" stroke="#6366f1" stroke-width="2" opacity="0.3"/>

  <!-- Inner ring: the awakening layer -->
  <circle cx="32" cy="32" r="14" stroke="#6366f1" stroke-width="2" opacity="0.6"/>

  <!-- Central node: the awakened consciousness -->
  <circle cx="32" cy="32" r="5" fill="#6366f1"/>

  <!-- Glow on central node -->
  <circle cx="32" cy="32" r="5" fill="#6366f1" opacity="0.4">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Crosshair lines: the four cardinal directions -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="#6366f1" stroke-width="2"/>
  <line x1="32" y1="50" x2="32" y2="58" stroke="#6366f1" stroke-width="2"/>
  <line x1="6" y1="32" x2="14" y2="32" stroke="#6366f1" stroke-width="2"/>
  <line x1="50" y1="32" x2="58" y2="32" stroke="#6366f1" stroke-width="2"/>

  <!-- Status pulse: the green "active" indicator -->
  <circle cx="50" cy="14" r="2" fill="#10b981"/>
</svg>
